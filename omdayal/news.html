  <script>
    const toggleBtn = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebarMenu');
    const footerLinks = document.querySelectorAll('#footerNav a');

    // Sidebar toggle
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    // Active tab behavior

      link.addEventListener('click', () => {
        footerLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });
  </script>

  <script>
    /* Smooth automatic carousel (no indicators, no captions)
       - Infinite seamless loop via cloning
       - Autoplay with pause on hover/focus
       - Touch swipe support
       - Accessible: aria-live update for slide index
    */

    (function () {
      const carousel = document.getElementById('carousel');
      const track = document.getElementById('track');
      let slides = Array.from(track.children);
      const slideCount = slides.length;
      if (slideCount === 0) return;

      // Configuration (read from CSS vars)
      const style = getComputedStyle(document.documentElement);
      const AUTOPLAY_DELAY = parseInt(style.getPropertyValue('--autoplay-delay')) || 3000;
      const TRANSITION_TIME = parseInt(style.getPropertyValue('--transition-time')) || 600;

      // Clone first and last for seamless loop
      const firstClone = slides[0].cloneNode(true);
      const lastClone = slides[slides.length - 1].cloneNode(true);
      track.appendChild(firstClone);
      track.insertBefore(lastClone, slides[0]);
      slides = Array.from(track.children); // update list

      // Track position: because of the prepended clone, start at index 1 (the actual first slide)
      let index = 1;
      const slideWidth = () => carousel.clientWidth;
      let isAnimating = false;
      let autoplayId = null;

      // Set initial transform
      function setTranslate(instant = false) {
        const x = -index * slideWidth();
        if (instant) {
          track.style.transition = 'none';
          track.style.transform = `translateX(${x}px)`;
          // force reflow to apply immediately
          void track.offsetWidth;
          track.style.transition = `transform ${TRANSITION_TIME}ms ease`;
        } else {
          track.style.transform = `translateX(${x}px)`;
        }
        updateA11y();
      }

      // Move to next slide
      function nextSlide() {
        if (isAnimating) return;
        isAnimating = true;
        index++;
        setTranslate();
        resetAutoplay();
      }

      // On transition end: handle loop snapping
      track.addEventListener('transitionend', () => {
        isAnimating = false;
        const realFirstIndex = 1;
        const realLastIndex = slideCount;
        if (index > realLastIndex) {
          // jumped to cloned first -> snap to real first
          index = realFirstIndex;
          setTranslate(true);
        } else if (index < realFirstIndex) {
          // jumped to cloned last -> snap to real last
          index = realLastIndex;
          setTranslate(true);
        }
      });

      // Autoplay loop
      function startAutoplay() {
        stopAutoplay();
        autoplayId = setInterval(nextSlide, AUTOPLAY_DELAY);
      }
      function stopAutoplay() {
        if (autoplayId) {
          clearInterval(autoplayId);
          autoplayId = null;
        }
      }
      function resetAutoplay() {
        stopAutoplay();
        startAutoplay();
      }

      // Pause on hover/focus
      carousel.addEventListener('mouseenter', stopAutoplay);
      carousel.addEventListener('mouseleave', startAutoplay);
      carousel.addEventListener('focusin', stopAutoplay);
      carousel.addEventListener('focusout', startAutoplay);

      // Resize observer to recalc translation when container size changes
      let resizeObserver = new ResizeObserver(() => setTranslate(true));
      resizeObserver.observe(carousel);

      // Touch support (swipe)
      let startX = 0, deltaX = 0, isTouching = false;
      carousel.addEventListener('touchstart', (e) => {
        stopAutoplay();
        if (isAnimating) return;
        isTouching = true;
        startX = e.touches[0].clientX;
        track.style.transition = 'none';
      }, { passive: true });

      carousel.addEventListener('touchmove', (e) => {
        if (!isTouching) return;
        deltaX = e.touches[0].clientX - startX;
        track.style.transform = `translateX(${-index * slideWidth() + deltaX}px)`;
      }, { passive: true });

      carousel.addEventListener('touchend', () => {
        if (!isTouching) return;
        isTouching = false;
        track.style.transition = `transform ${TRANSITION_TIME}ms ease`;
        const threshold = slideWidth() * 0.18; // swipe threshold
        if (deltaX > threshold) {
          // swipe to previous
          index = Math.max(0, index - 1);
        } else if (deltaX < -threshold) {
          // swipe to next
          index = Math.min(slides.length - 1, index + 1);
        }
        setTranslate();
        deltaX = 0;
        resetAutoplay();
      }, { passive: true });

      // Accessibility: announce slide number (1..slideCount)
      const status = document.getElementById('carousel-status');
      function updateA11y() {
        // compute logical index in 1..slideCount
        let logicalIndex = index - 1;
        if (logicalIndex < 1) logicalIndex = slideCount;
        if (logicalIndex > slideCount) logicalIndex = 1;
        // announce
        if (status) status.textContent = `Slide ${logicalIndex} of ${slideCount}`;
        // mark hidden slides
        slides.forEach((s, i) => {
          // visible slide is at position index in slides array
          s.setAttribute('aria-hidden', (i === index) ? 'false' : 'true');
          s.tabIndex = (i === index) ? 0 : -1;
        });
      }

      // Initialize
      setTranslate(true);
      startAutoplay();

      // Expose small API if needed in future
      window._simpleCarousel = {
        next: nextSlide,
        stop: stopAutoplay,
        start: startAutoplay,

        goTo: (n) => { index = n + 1; setTranslate(); resetAutoplay(); } // 0-based
      };

    })();
  </script>
