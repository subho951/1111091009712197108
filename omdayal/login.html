<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Om Dayal Group</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>



  <!-- Main Content -->
  <main class="content">
    <div class="logo text-center"><img src="images-omdayal/logo-om-dayal.png"></div>
    <h6 class="fw-bold pt-2 pb-2 text-dark text-center"><i class="fa fa-lock"></i> Secured Login</h6>
    <div class="card shadow">

      <div class="card-body pt-4 pb-4">

        <form>
          <!-- Email -->
          <div class="form-floating mb-3">
            <input type="number" class="form-control" id="phone" placeholder="Mobile Number (Username)">
            <label for="email">Mobile Number (Username)</label>
          </div>

          <!-- Password -->
          <div class="form-floating mb-3">
            <input type="password" class="form-control" id="password" placeholder="Password">
            <label for="password">Password</label>
          </div>

          <!-- Remember me -->
          <div class=" mb-3" data-bs-toggle="modal" data-bs-target="#forgotPassword">
            Forgot Password ?
          </div>

          <!-- Button -->
          <button class="btn btn-danger bg-gradient w-100">Login</button>
        </form>






      </div>
    </div>



    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotPassword" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">

          <div class="modal-header bg-danger bg-gradient text-white">
            <h5 class="modal-title">Forgot Password ?</h5>
            <!--<button type="button" class="btn-close" data-bs-dismiss="modal"></button>-->
          </div>

          <div class="modal-body text-center">

            <form>
              <!-- Email -->
              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="Type your registered email address">
                <label for="email">Registered Email Address</label>
              </div>



              <!-- Remember me -->
              <div class=" mb-3">
                After submitting, please check your registered email address for instruction.
              </div>

              <!-- Button -->
              <button class="btn btn-danger bg-gradient w-100">Submit</button>
            </form>

          </div>

          <div class="modal-footer">
            <button class="btn btn-dark btn-sm" data-bs-dismiss="modal">Close</button>
          </div>

        </div>
      </div>
    </div>







    <div class="p-4">&nbsp;</div>

  </main>







  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
